<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Confidence Ring — What am I holding?</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>

  <video id="webcam" autoplay playsinline muted aria-hidden="true"></video>

  <div id="top-bar">
    <span id="dot" aria-hidden="true"></span>
    <span id="status-text">Point your camera at an object</span>
    <button id="restart-btn" class="chip-btn" hidden>Restart</button>
  </div>

  <div id="start-screen">
    <div id="start-card">
      <h1>Confidence Ring</h1>
      <p>Point your camera at the object. Watch the ring fill as it gets sure, then it reads the answer out loud.</p>
      <button id="start-btn">Start listening</button>
      <p id="start-error" role="alert"></p>
    </div>
  </div>

  <main id="ring-stage">
    <div id="ring-wrap">
      <svg id="ring-svg" viewBox="0 0 200 200" aria-hidden="true">
        <circle id="ring-track" cx="100" cy="100" r="88" />
        <circle id="ring-fill" cx="100" cy="100" r="88" />
      </svg>
      <div id="ring-center">
        <div id="guess" aria-live="polite">…</div>
      </div>
    </div>
    <p id="hint-text"></p>
    <div id="confidence-row">
      <span id="confidence"></span>
      <button id="repeat-btn" aria-label="Say it again" hidden>&#8635; Say it again</button>
    </div>
  </main>

  <span id="sr-announce" class="sr-only" aria-live="assertive"></span>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
